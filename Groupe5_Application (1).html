<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CahierSmart — Application</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet"/>

<style>
/* ══════════════════════════════════════════
   DESIGN SYSTEM — 1:1 copié depuis site.html
══════════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root {
  --navy:#0a1628;
  --navy2:#112240;
  --blue:#1a56db;
  --blue-light:#3b82f6;
  --accent:#00e5b0;
  --accent2:#f59e0b;
  --text:#e2e8f0;
  --muted:#8892a4;
  --card:rgba(255,255,255,0.04);
  --card-border:rgba(255,255,255,0.08);
  --radius:16px;
}

html,body,#root{height:100%;overflow:hidden}
body{
  font-family:'Sora',sans-serif;
  background:var(--navy);
  color:var(--text);
  line-height:1.6;
}

/* Grille décorative — identique au site */
body::before{
  content:'';
  position:fixed;inset:0;
  background-image:
    linear-gradient(rgba(26,86,219,0.07) 1px,transparent 1px),
    linear-gradient(90deg,rgba(26,86,219,0.07) 1px,transparent 1px);
  background-size:48px 48px;
  pointer-events:none;z-index:0;
}

/* ── LAYOUT ─────────────────── */
.app{display:flex;height:100vh;position:relative;z-index:1}

/* ── SIDEBAR ────────────────── */
.sidebar{
  width:230px;min-width:230px;
  background:rgba(10,22,40,0.92);
  backdrop-filter:blur(20px);
  border-right:1px solid var(--card-border);
  display:flex;flex-direction:column;
  position:relative;overflow:hidden;
}
/* blob déco sidebar */
.sidebar::after{
  content:'';position:absolute;
  width:200px;height:200px;border-radius:50%;
  background:var(--blue);filter:blur(80px);
  opacity:.1;bottom:-60px;left:-60px;pointer-events:none;
}
.sidebar-logo{
  padding:20px 18px 18px;
  border-bottom:1px solid var(--card-border);
  display:flex;align-items:center;gap:10px;
}
.logo-icon{
  width:36px;height:36px;
  background:linear-gradient(135deg,var(--blue),var(--accent));
  border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;flex-shrink:0;
}
.logo-name{font-size:1.05rem;font-weight:700;color:#fff}
.logo-sub{font-size:.68rem;color:var(--muted);margin-top:1px}

.sidebar-nav{flex:1;padding:14px 10px;overflow-y:auto;display:flex;flex-direction:column;gap:3px}
.nav-section{
  font-size:.65rem;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);opacity:.55;
  padding:10px 10px 4px;
}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 12px;border-radius:10px;
  cursor:pointer;color:var(--muted);
  font-size:.8rem;font-weight:500;
  transition:all .2s;border:none;background:none;
  width:100%;text-align:left;font-family:'Sora',sans-serif;
}
.nav-item:hover{background:rgba(255,255,255,.05);color:var(--text)}
.nav-item.active{
  background:rgba(26,86,219,.18);
  border:1px solid rgba(26,86,219,.3);
  color:#fff;
}
.nav-item.active .nav-ico{
  background:linear-gradient(135deg,var(--blue),var(--blue-light));
}
.nav-ico{
  width:26px;height:26px;border-radius:7px;
  background:rgba(255,255,255,.06);
  display:flex;align-items:center;justify-content:center;
  font-size:12px;flex-shrink:0;transition:background .2s;
}

.sidebar-user{
  padding:14px 16px;border-top:1px solid var(--card-border);
  display:flex;align-items:center;gap:10px;position:relative;z-index:1;
}
.user-av{
  width:32px;height:32px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,var(--blue),var(--accent));
  display:flex;align-items:center;justify-content:center;
  font-size:.72rem;font-weight:700;color:#fff;
}
.user-name{font-size:.82rem;font-weight:600;color:#fff}
.user-role{font-size:.68rem;color:var(--muted)}

/* ── MAIN ───────────────────── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}

/* topbar — nav du site */
.topbar{
  height:56px;min-height:56px;
  background:rgba(10,22,40,.88);
  backdrop-filter:blur(16px);
  border-bottom:1px solid var(--card-border);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;gap:16px;position:relative;z-index:5;
}
.topbar-title{
  font-family:'DM Serif Display',serif;
  font-size:1.1rem;color:#fff;
}
.topbar-right{display:flex;align-items:center;gap:10px}

/* ── CONTENT ────────────────── */
.content{
  flex:1;overflow-y:auto;padding:24px;
  scroll-behavior:smooth;
}
.content::-webkit-scrollbar{width:4px}
.content::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:2px}

/* ── SECTION TAG — identique site ── */
.section-tag{
  display:inline-block;
  font-size:.72rem;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent);margin-bottom:.75rem;
}
.section-title{
  font-family:'DM Serif Display',serif;
  font-size:1.6rem;font-weight:400;
  color:#fff;margin-bottom:.75rem;line-height:1.15;
}
.section-sub{
  font-size:.88rem;color:var(--muted);
  max-width:520px;line-height:1.75;margin-bottom:2rem;
}

/* ── BUTTONS — identiques site ── */
.btn{
  display:inline-flex;align-items:center;gap:7px;
  padding:.55rem 1.4rem;border-radius:8px;
  font-family:'Sora',sans-serif;font-size:.85rem;font-weight:600;
  cursor:pointer;border:none;text-decoration:none;
  transition:all .2s;
}
.btn-primary{
  background:linear-gradient(135deg,var(--blue),var(--blue-light));
  color:#fff;box-shadow:0 4px 20px rgba(26,86,219,.3);
}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 28px rgba(26,86,219,.45)}
.btn-secondary{
  background:transparent;color:var(--text);
  border:1px solid var(--card-border);
}
.btn-secondary:hover{background:var(--card)}
.btn-danger{
  background:rgba(239,68,68,.12);color:#f87171;
  border:1px solid rgba(239,68,68,.2);
}
.btn-danger:hover{background:rgba(239,68,68,.22)}
.btn-accent{
  background:rgba(0,229,176,.1);color:var(--accent);
  border:1px solid rgba(0,229,176,.2);
}
.btn-sm{padding:.4rem .9rem;font-size:.75rem}

/* ── BADGES — identiques site ── */
.badge{
  display:inline-block;padding:3px 10px;
  border-radius:100px;font-size:.7rem;font-weight:600;
}
.badge-ok{background:rgba(0,229,176,.15);color:var(--accent)}
.badge-pending{background:rgba(245,158,11,.15);color:#f59e0b}
.badge-miss{background:rgba(239,68,68,.15);color:#f87171}
.badge-blue{background:rgba(26,86,219,.18);color:#60a5fa}
.badge-purple{background:rgba(124,58,237,.15);color:#a78bfa}
.badge-hero{
  display:inline-flex;align-items:center;gap:8px;
  background:rgba(0,229,176,.1);border:1px solid rgba(0,229,176,.25);
  color:var(--accent);padding:.4rem 1rem;border-radius:100px;
  font-size:.78rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
}

/* ── CARDS — identiques site ── */
.card{
  background:var(--card);
  border:1px solid var(--card-border);
  border-radius:var(--radius);padding:1.25rem;
  transition:border-color .3s;
}
.card:hover{border-color:rgba(26,86,219,.3)}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
.card-title{font-family:'DM Serif Display',serif;font-size:.95rem;color:#fff}

/* ── STATS — mock du site ── */
.mock-cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:.75rem;margin-bottom:1.25rem;
}
.mock-card{
  background:rgba(26,86,219,.12);
  border:1px solid rgba(26,86,219,.2);
  border-radius:10px;padding:1rem;
  transition:border-color .3s,transform .2s;
}
.mock-card:hover{border-color:rgba(26,86,219,.4);transform:translateY(-2px)}
.mock-card-num{
  font-family:'DM Serif Display',serif;
  font-size:1.8rem;color:#fff;line-height:1;
}
.mock-card-label{font-size:.7rem;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:.05em}

/* ── MOCK TABLE — identique site ── */
.mock-table{width:100%;border-collapse:collapse;font-size:.82rem}
.mock-table th{
  text-align:left;padding:.55rem .85rem;
  color:var(--muted);border-bottom:1px solid var(--card-border);
  font-weight:600;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;
}
.mock-table td{
  padding:.7rem .85rem;
  color:var(--text);
  border-bottom:1px solid rgba(255,255,255,.04);
}
.mock-table tr:last-child td{border-bottom:none}
.mock-table tr:hover td{background:rgba(255,255,255,.02)}

/* ── ACTORS — identiques site ── */
.actors-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:1.25rem;margin-bottom:1.5rem;
}
.actor-card{
  background:var(--card);border:1px solid var(--card-border);
  border-radius:var(--radius);padding:1.5rem 1.25rem;
  transition:border-color .3s,transform .3s;cursor:default;
}
.actor-card:hover{border-color:rgba(26,86,219,.5);transform:translateY(-4px)}
.actor-icon{
  width:52px;height:52px;border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  font-size:1.5rem;margin-bottom:1rem;
}
.actor-card:nth-child(1) .actor-icon{background:rgba(26,86,219,.2)}
.actor-card:nth-child(2) .actor-icon{background:rgba(0,229,176,.15)}
.actor-card:nth-child(3) .actor-icon{background:rgba(245,158,11,.15)}
.actor-card:nth-child(4) .actor-icon{background:rgba(239,68,68,.15)}
.actor-card h3{font-size:.95rem;font-weight:600;color:#fff;margin-bottom:.5rem}
.actor-card p{font-size:.82rem;color:var(--muted);line-height:1.6}

/* ── FEATURES — identiques site ── */
.feature-item{
  display:flex;gap:1rem;padding:1.1rem;
  background:var(--card);border:1px solid var(--card-border);
  border-radius:12px;transition:border-color .3s;margin-bottom:.85rem;
}
.feature-item:hover{border-color:rgba(26,86,219,.4)}
.feature-dot{
  width:36px;height:36px;flex-shrink:0;border-radius:10px;
  background:linear-gradient(135deg,var(--blue),var(--accent));
  display:flex;align-items:center;justify-content:center;font-size:1rem;
}
.feature-item h4{font-size:.88rem;font-weight:600;color:#fff;margin-bottom:.25rem}
.feature-item p{font-size:.78rem;color:var(--muted)}

/* ── GANTT — identique site ── */
.gantt-wrap{
  background:var(--card);border:1px solid var(--card-border);
  border-radius:var(--radius);overflow:hidden;margin-bottom:1.5rem;
}
.gantt-header{
  display:grid;grid-template-columns:200px repeat(8,1fr);
  padding:.85rem 1.25rem;
  background:rgba(26,86,219,.12);
  font-size:.72rem;font-weight:600;color:var(--muted);
  text-transform:uppercase;letter-spacing:.08em;
  border-bottom:1px solid var(--card-border);
}
.gantt-row{
  display:grid;grid-template-columns:200px repeat(8,1fr);
  padding:.7rem 1.25rem;align-items:center;
  border-bottom:1px solid var(--card-border);
  transition:background .2s;min-height:50px;
}
.gantt-row:last-child{border-bottom:none}
.gantt-row:hover{background:rgba(255,255,255,.02)}
.gantt-label{font-size:.82rem;color:var(--text);font-weight:500}
.gantt-bar{
  height:24px;border-radius:6px;
  display:flex;align-items:center;padding:0 8px;
  font-size:.68rem;font-weight:600;color:#fff;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  grid-column-start:var(--cs);grid-column-end:span var(--span);
}
.bar-blue{background:linear-gradient(90deg,var(--blue),var(--blue-light))}
.bar-teal{background:linear-gradient(90deg,#0d9488,var(--accent))}
.bar-amber{background:linear-gradient(90deg,#d97706,#f59e0b)}
.bar-purple{background:linear-gradient(90deg,#7c3aed,#a78bfa)}

/* ── TECH GRID — identique site ── */
.tech-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:1rem;margin-bottom:1.5rem;
}
.tech-card{
  background:var(--card);border:1px solid var(--card-border);
  border-radius:14px;padding:1.25rem 1rem;text-align:center;
  transition:border-color .3s,transform .3s;
}
.tech-card:hover{border-color:rgba(0,229,176,.35);transform:translateY(-3px)}
.tech-logo{font-size:1.8rem;margin-bottom:.6rem;display:block}
.tech-card h4{font-size:.85rem;font-weight:600;color:#fff;margin-bottom:.25rem}
.tech-card p{font-size:.75rem;color:var(--muted)}

/* ── PLANNING EMPLOI DU TEMPS ─ */
.edt-grid{
  border:1px solid var(--card-border);border-radius:var(--radius);
  overflow:hidden;background:var(--card);
}
.edt-head{
  display:grid;grid-template-columns:88px repeat(5,1fr);
  background:rgba(26,86,219,.12);border-bottom:1px solid var(--card-border);
}
.edt-head-cell{
  padding:10px 8px;font-size:.68rem;font-weight:700;
  text-transform:uppercase;letter-spacing:.08em;color:var(--muted);
  text-align:center;border-right:1px solid var(--card-border);
}
.edt-head-cell:last-child{border-right:none}
.edt-row{
  display:grid;grid-template-columns:88px repeat(5,1fr);
  border-bottom:1px solid var(--card-border);min-height:70px;
}
.edt-row:last-child{border-bottom:none}
.edt-time{
  padding:6px;font-size:.65rem;color:var(--muted);text-align:center;
  border-right:1px solid var(--card-border);
  display:flex;align-items:center;justify-content:center;
  background:rgba(26,86,219,.06);line-height:1.4;
}
.edt-cell{
  border-right:1px solid var(--card-border);padding:5px;
  cursor:pointer;transition:background .15s;
}
.edt-cell:last-child{border-right:none}
.edt-cell:hover{background:rgba(26,86,219,.06)}
.lesson{
  border-radius:8px;padding:6px 8px;height:100%;
  display:flex;flex-direction:column;justify-content:center;
}
.lesson.blue{background:linear-gradient(135deg,rgba(26,86,219,.2),rgba(59,130,246,.12));border:1px solid rgba(26,86,219,.3)}
.lesson.teal{background:rgba(0,229,176,.08);border:1px solid rgba(0,229,176,.2)}
.lesson.amber{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.2)}
.lesson.purple{background:rgba(124,58,237,.1);border:1px solid rgba(124,58,237,.22)}
.lesson-name{font-size:.7rem;font-weight:700;color:#fff;line-height:1.3}
.lesson-room{font-size:.62rem;color:var(--muted);margin-top:2px}
.lesson-del{
  font-size:.58rem;margin-top:3px;background:rgba(239,68,68,.15);
  border:none;border-radius:4px;padding:2px 6px;color:#f87171;
  cursor:pointer;font-family:'Sora',sans-serif;width:fit-content;
}

/* ── ENTRY CARDS — cahier ─── */
.entry-card{
  background:var(--card);border:1px solid var(--card-border);
  border-radius:12px;padding:1rem 1.25rem;margin-bottom:.85rem;
  transition:border-color .25s,transform .2s;
}
.entry-card:hover{border-color:rgba(26,86,219,.35);transform:translateY(-1px)}

/* ── MODAL — identique site ── */
.modal-overlay{
  position:fixed;inset:0;
  background:rgba(5,12,28,.88);backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;
  z-index:100;padding:1.5rem;
}
.modal-box{
  background:#0e1f3d;
  border:1px solid rgba(26,86,219,.25);
  border-radius:20px;padding:2rem;
  width:100%;max-width:560px;max-height:88vh;overflow-y:auto;
  position:relative;animation:popIn .25s ease;
}
.modal-box-wide{max-width:720px}
@keyframes popIn{
  from{opacity:0;transform:scale(.94) translateY(20px)}
  to{opacity:1;transform:scale(1) translateY(0)}
}
.modal-close{
  position:absolute;top:1.2rem;right:1.4rem;
  background:rgba(255,255,255,.07);border:none;color:var(--muted);
  width:30px;height:30px;border-radius:50%;font-size:.9rem;cursor:pointer;
  transition:background .2s;
}
.modal-close:hover{background:rgba(255,255,255,.15);color:#fff}
.modal-header{text-align:center;margin-bottom:1.5rem}
.modal-icon{font-size:2rem;display:block;margin-bottom:.5rem}
.modal-header h3{font-size:1.2rem;color:#fff;font-weight:600;margin-bottom:.4rem}
.modal-header p{font-size:.85rem;color:var(--muted)}

/* ── FORM — identique site ── */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1.25rem}
.form-group{display:flex;flex-direction:column;gap:6px}
.form-group.full{grid-column:1/-1}
.form-group label{font-size:.72rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.form-group input,
.form-group select,
.form-group textarea{
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.1);
  border-radius:10px;padding:.65rem 1rem;
  color:#fff;font-family:'Sora',sans-serif;font-size:.88rem;
  transition:border-color .2s;outline:none;
}
.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus{border-color:var(--blue-light)}
.form-group select option{background:#0e1f3d}
.form-group textarea{resize:vertical;min-height:80px;line-height:1.6}
.form-group input::placeholder,
.form-group textarea::placeholder{color:var(--muted);opacity:.7}
.btn-submit{
  width:100%;padding:.85rem;
  background:linear-gradient(135deg,var(--blue),var(--blue-light));
  border:none;border-radius:12px;color:#fff;
  font-family:'Sora',sans-serif;font-size:.95rem;font-weight:600;
  cursor:pointer;transition:opacity .2s;
}
.btn-submit:hover{opacity:.88}

/* ── DOC TABS — identiques site ── */
.doc-tabs{
  display:flex;gap:.5rem;flex-wrap:wrap;
  margin-bottom:1.5rem;border-bottom:1px solid rgba(255,255,255,.08);
  padding-bottom:.75rem;
}
.doc-tab{
  background:transparent;border:1px solid rgba(255,255,255,.1);
  border-radius:8px;color:var(--muted);
  font-family:'Sora',sans-serif;font-size:.78rem;font-weight:600;
  padding:.4rem 1rem;cursor:pointer;transition:all .2s;
}
.doc-tab.active{background:var(--blue);border-color:var(--blue);color:#fff}
.doc-tab:hover:not(.active){border-color:rgba(255,255,255,.3);color:#fff}

/* ── ARCH DIAGRAM — identique site ── */
.arch-diagram{
  display:flex;align-items:center;justify-content:center;
  gap:.75rem;margin:1rem 0 1.5rem;flex-wrap:wrap;
}
.arch-block{
  background:rgba(26,86,219,.15);border:1px solid rgba(26,86,219,.3);
  border-radius:12px;padding:.75rem 1.25rem;text-align:center;
  font-size:.85rem;font-weight:600;color:#fff;line-height:1.4;
}
.arch-block small{display:block;color:var(--muted);font-size:.72rem;font-weight:400}
.arch-arrow{color:var(--accent);font-size:1.4rem}

/* ── DOC CARDS ── */
.doc-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem;margin-bottom:1.5rem}
.doc-card{
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
  border-radius:12px;padding:1rem;
}
.doc-card-icon{font-size:1.4rem;display:block;margin-bottom:.5rem}
.doc-card strong{font-size:.82rem;color:#fff;display:block;margin-bottom:.35rem}
.doc-card p{font-size:.75rem;color:var(--muted);margin:0}

/* ── DOC LIST ── */
.doc-list{list-style:none;padding:0;margin-bottom:1.25rem}
.doc-list li{
  padding:.5rem .75rem;border-left:3px solid var(--blue);
  margin-bottom:.45rem;background:rgba(26,86,219,.08);
  border-radius:0 8px 8px 0;font-size:.85rem;color:var(--text);
}

/* ── STEPS ── */
.step-list{display:flex;flex-direction:column;gap:.65rem}
.step{
  display:flex;gap:1rem;align-items:flex-start;
  background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);
  border-radius:12px;padding:.9rem;
}
.step-num{
  min-width:28px;height:28px;background:var(--blue);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:.75rem;font-weight:700;color:#fff;
}
.step strong{display:block;font-size:.85rem;color:#fff;margin-bottom:.35rem}

<body>
<div id="root"></div>

<script type="text/babel">
const {useState,useRef,useEffect}=React;

/* ════════════════════════════════

const MATIERES_INIT=[

  {id:3,matId:3,jour:2,h:2,salle:"Labo 1"},
  {id:4,matId:4,jour:3,h:0,salle:"Salle 5"},
  {id:5,matId:1,jour:4,h:1,salle:"Salle 12"},
  {id:6,matId:2,jour:2,h:0,salle:"Salle 8"},
];

const JOURS=["Lundi","Mardi","Mercredi","Jeudi","Vendredi"];
const HORAIRES=["08h–09h","09h–10h","10h15–11h15","14h–15h","15h–16h"];
const TYPES=["Cours","TP","Évaluation","Révision","Correction","Activité"];
const CLASSES=["6ème A","5ème A","4ème A","3ème B","2nde A","1ère A","T·S1","T·S2","T·L"];

/* ── helpers ── */
const fmtDate=d=>{if(!d)return"";const[y,m,j]=d.split("-");const mo=["jan","fév","mar","avr","mai","jun","jul","aoû","sep","oct","nov","déc"];return`${j} ${mo[+m-1]} ${y}`};
const statBadge=s=>({validé:"badge-ok",en_cours:"badge-pending",a_faire:"badge-miss"}[s]||"badge-miss");
const statLabel=s=>({validé:"Saisi",en_cours:"En cours",a_faire:"À faire"}[s]||s);
const coulFill=c=>({blue:"fill-blue",teal:"fill-teal",amber:"fill-amber",purple:"fill-purple"}[c]||"fill-blue");
const lessonCls=c=>({blue:"blue",teal:"teal",amber:"amber",purple:"purple"}[c]||"blue");

/* ════════════════════════════════
   PARTIE 1 — ACTEURS & DASHBOARD
   (section "Qui utilise" du site)
════════════════════════════════ */
function PartieActeurs({entries,matieres}){
  const valides=entries.filter(e=>e.statut==="validé").length;
  const encours=entries.filter(e=>e.statut==="en_cours").length;
  const afaire=entries.filter(e=>e.statut==="a_faire").length;
  const totalMin=entries.reduce((s,e)=>s+Number(e.duree||0),0);

  return(
    <div>
      {/* Hero badge */}
      <div className="flex items-c gap-8 mb16">
        <span className="badge-hero">✦ Année scolaire 2025–2026</span>
      </div>
      <div className="section-tag">Qui utilise CahierSmart ?</div>
      <h2 className="section-title">Une plateforme,<br/>quatre acteurs clés</h2>
      <p className="section-sub">Chaque utilisateur dispose d'un espace personnalisé adapté à ses besoins et permissions.</p>

      {/* Acteurs — identiques au site */}
      <div className="actors-grid" style={{marginBottom:"1.5rem"}}>
        {[
          {ico:"👨‍🏫",titre:"Enseignant",desc:"Saisit les cours, objectifs pédagogiques, devoirs et évaluations directement depuis son espace."},
          {ico:"🎓",titre:"Élève",desc:"Consulte son programme, ses devoirs, ses notes et son historique de cours en temps réel."},
          {ico:"👨‍👩‍👧",titre:"Parent",desc:"Suit la scolarité de son enfant, reçoit des alertes et communique avec les enseignants."},

/* ════════════════════════════════
   PARTIE 2 — CAHIER DE TEXTES
   (section "Fonctionnalités" du site)
════════════════════════════════ */
function PartieCahier({entries,setEntries,matieres,setMatieres}){
  const [modal,setModal]=useState(false);
  const [modalMat,setModalMat]=useState(false);
  const [editing,setEditing]=useState(null);
  const [editingMat,setEditingMat]=useState(null);
  const [filt,setFilt]=useState("all");
  const [filtMat,setFiltMat]=useState("all");
  const [tab,setTab]=useState("entries"); // entries | matieres

  const E0={date:"",mat:"",titre:"",type:"Cours",desc:"",duree:55,comps:"",devoirs:"",statut:"a_faire"};
  const [form,setForm]=useState(E0);
  const fs=f=>setForm(p=>({...p,...f}));

  const M0={nom:"",code:"",couleur:"blue",enseignant:"",classe:CLASSES[0],prog:0};
  const [mform,setMform]=useState(M0);
  const mfs=f=>setMform(p=>({...p,...f}));

  const visible=entries.filter(e=>{
    if(filt!=="all"&&e.statut!==filt)return false;
    if(filtMat!=="all"&&String(e.mat)!==filtMat)return false;
    return true;
  });

  const openNew=()=>{setForm({...E0,date:new Date().toISOString().split("T")[0],mat:String(matieres[0]?.id||"")});setEditing(null);setModal(true)};
  const openEdit=e=>{setForm({...e,mat:String(e.mat)});setEditing(e.id);setModal(true)};
  const save=()=>{
    if(!form.titre||!form.date)return;
    const e={...form,mat:Number(form.mat),duree:Number(form.duree),id:editing||Date.now()};
    if(editing)setEntries(p=>p.map(x=>x.id===editing?e:x));
    else setEntries(p=>[...p,e]);
    setModal(false);
  };
  const del=id=>setEntries(p=>p.filter(e=>e.id!==id));
  const validate=id=>setEntries(p=>p.map(e=>e.id===id?{...e,statut:"validé"}:e));

  const openNewMat=()=>{setMform(M0);setEditingMat(null);setModalMat(true)};
  const openEditMat=m=>{setMform({...m,prog:String(m.prog)});setEditingMat(m.id);setModalMat(true)};
  const saveMat=()=>{
    if(!mform.nom)return;
    const m={...mform,prog:Number(mform.prog),id:editingMat||Date.now()};
    if(editingMat)setMatieres(p=>p.map(x=>x.id===editingMat?m:x));
    else setMatieres(p=>[...p,m]);
    setModalMat(false);
  };
  const delMat=id=>setMatieres(p=>p.filter(m=>m.id!==id));

  const matBadgeCls=c=>({teal:"badge-ok",amber:"badge-pending",purple:"badge-purple",blue:"badge-blue"}[c]||"badge-blue");

  return(
    <div>
      <div className="section-tag">Ce que nous offrons</div>
      <h2 className="section-title">Fonctionnalités<br/>intelligentes</h2>

      {/* Features bar — identique site */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"1rem",marginBottom:"1.5rem"}}>
        <div>
          {[
            {ico:"📝",t:"Saisie structurée des cours",p:"Titre, objectifs, contenu, documents joints et compétences ciblées."},
            {ico:"🔔",t:"Alertes & notifications",p:"Rappels automatiques pour les devoirs, évaluations et absences."},
            {ico:"📊",t:"Tableaux de bord analytiques",p:"Statistiques de progression et indicateurs pédagogiques par classe."},
          ].map(f=>(
            <div key={f.t} className="feature-item">
              <div className="feature-dot">{f.ico}</div>
              <div><h4>{f.t}</h4><p>{f.p}</p></div>
            </div>
          ))}
        </div>
        <div>
          {[
            {ico:"📅",t:"Calendrier pédagogique",p:"Vue hebdomadaire et mensuelle synchronisée avec l'emploi du temps."},
            {ico:"🔐",t:"Gestion des rôles & accès",p:"Permissions granulaires par profil — aucune donnée sans autorisation."},
            {ico:"🤖",t:"Assistant IA intégré",p:"Génération automatique de séances, objectifs et évaluations par l'IA."},
          ].map(f=>(
            <div key={f.t} className="feature-item">
              <div className="feature-dot">{f.ico}</div>
              <div><h4>{f.t}</h4><p>{f.p}</p></div>
            </div>
          ))}
        </div>
      </div>

      {/* Onglets Séances / Matières */}
      <div className="flex jbet items-c mb16">
        <div className="tab-bar">
          {[["entries","Séances"],["matieres","Matières"]].map(([v,l])=>(
            <button key={v} className={`tab-btn${tab===v?" active":""}`} onClick={()=>setTab(v)}>{l}</button>
          ))}
        </div>
        <div className="flex gap-8">
          {tab==="entries"&&<>
            <div className="tab-bar">
              {[["all","Tous"],["validé","Saisis"],["en_cours","En cours"],["a_faire","À faire"]].map(([v,l])=>(
                <button key={v} className={`tab-btn${filt===v?" active":""}`} onClick={()=>setFilt(v)}>{l}</button>
              ))}
            </div>
            <select className="form-group" style={{}} onChange={e=>setFiltMat(e.target.value)} value={filtMat}>
              <option value="all">Toutes</option>
              {matieres.map(m=><option key={m.id} value={String(m.id)}>{m.nom}</option>)}
            </select>
            <button className="btn btn-primary btn-sm" onClick={openNew}>+ Nouvelle séance</button>
          </>}
          {tab==="matieres"&&<button className="btn btn-primary btn-sm" onClick={openNewMat}>+ Nouvelle matière</button>}

      </div>

      {tab==="entries"&&(
        visible.length===0
        ?<div className="empty-state"><span className="empty-icon">📓</span><div>Aucune séance trouvée</div></div>

          const mat=matieres.find(m=>m.id===e.mat);

            <div key={e.id} className="entry-card">
              <div className="flex jbet items-c mb8">
                <div className="flex gap-8 items-c">
                  <span className={`badge ${matBadgeCls(mat?.couleur)}`}>{mat?.code}</span>
                  <span className={`badge ${statBadge(e.statut)}`}>{statLabel(e.statut)}</span>
                  <span className="badge" style={{background:"rgba(255,255,255,.06)",color:"var(--muted)",border:"1px solid var(--card-border)"}}>{e.type}</span>
                </div>
                <div className="flex gap-8 items-c">
                  <span className="text-xs muted">{fmtDate(e.date)} · {e.duree} min</span>
                  {e.statut!=="validé"&&<button className="btn btn-accent btn-sm" onClick={()=>validate(e.id)}>✓ Valider</button>}

              </div>
              <div className="fw6" style={{fontSize:".9rem",color:"#fff",marginBottom:"4px"}}>{e.titre}</div>
              <div className="text-sm muted" style={{lineHeight:1.7,marginBottom:e.devoirs?8:0}}>{e.desc}</div>

            </div>

      {tab==="matieres"&&(
        <div className="g2">
          {matieres.map(m=>{

/* ════════════════════════════════
   ASSISTANT IA
════════════════════════════════ */
function AssistantIA({matieres,entries}){
  const [msgs,setMsgs]=useState([{role:"assistant",content:"Bonjour ! Je suis l'assistant pédagogique CahierSmart ✦\n\nJe peux vous aider à rédiger des séances, suggérer des progressions, analyser votre cahier ou générer des évaluations. Comment puis-je vous aider ?"}]);
  const [input,setInput]=useState("");
  const [loading,setLoading]=useState(false);
  const endRef=useRef(null);
  useEffect(()=>endRef.current?.scrollIntoView({behavior:"smooth"}),[msgs]);

  const CHIPS=["Rédige une séance de cours","Génère des devoirs adaptés","Analyse ma progression","Propose une évaluation","Crée un plan de révision","Suggère des objectifs"];

  const SYS=`Tu es l'assistant pédagogique intégré à CahierSmart, plateforme sénégalaise de gestion des cahiers de textes.
Matières : ${matieres.map(m=>m.nom).join(", ")}. Séances enregistrées : ${entries.length}.
Réponds en français, de façon professionnelle et concise. Tu aides : rédaction séances, planification, compétences, évaluations, devoirs.`;

  const send=async(txt)=>{
    const msg=txt||input.trim();
    if(!msg||loading)return;
    setInput("");
    const updated=[...msgs,{role:"user",content:msg}];
    setMsgs(updated);setLoading(true);
    try{
      const r=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",
        headers:{"Content-Type":"application/json","anthropic-dangerous-direct-browser-access":"true"},
        body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:800,system:SYS,messages:updated.map(m=>({role:m.role,content:m.content}))})
      });
      const d=await r.json();
      setMsgs(p=>[...p,{role:"assistant",content:d.content?.[0]?.text||"Désolé, erreur de réponse."}]);
    }catch{
      setMsgs(p=>[...p,{role:"assistant",content:"Erreur de connexion. Vérifiez votre accès réseau."}]);
    }
    setLoading(false);
  };

  return(
    <div className="ai-wrap">
      <div className="ai-chips">
        {CHIPS.map(c=><button key={c} className="ai-chip" onClick={()=>send(c)}>{c}</button>)}
      </div>
      <div className="ai-messages">
        {msgs.map((m,i)=>(
          <div key={i} className={`ai-msg${m.role==="user"?" user":""}`}>
            <div className={`msg-av${m.role==="assistant"?" ai":" me"}`}>{m.role==="assistant"?"IA":"Moi"}</div>
            <div className="msg-bubble">{m.content}</div>
          </div>
        ))}
        {loading&&<div className="ai-msg"><div className="msg-av ai">IA</div><div className="msg-bubble muted">En train de rédiger…</div></div>}
        <div ref={endRef}/>
      </div>
      <div className="ai-input-row">
        <textarea className="ai-input" placeholder="Posez votre question pédagogique… (Entrée pour envoyer)" value={input}
          onChange={e=>setInput(e.target.value)}
          onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}}}
        />
        <button className="btn btn-primary btn-sm" onClick={()=>send()} disabled={loading||!input.trim()}>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </div>
  );
}

/* ════════════════════════════════
   APP ROOT
════════════════════════════════ */
function App(){
  const [page,setPage]=useState("acteurs");
  const [matieres,setMatieres]=useState(MATIERES_INIT);
  const [entries,setEntries]=useState(ENTRIES_INIT);
  const [planning,setPlanning]=useState(PLANNING_INIT);

  const NAV=[
    {id:"acteurs",   ico:"👥", label:"Acteurs & Dashboard",  sub:"Partie 1"},
    {id:"cahier",    ico:"📝", label:"Cahier de textes",      sub:"Partie 2"},
    {id:"planning",  ico:"📅", label:"Planning & EDT",        sub:"Partie 3"},
    {id:"appli",     ico:"💻", label:"Application & Technos", sub:"Partie 4"},
    {id:"ia",        ico:"🤖", label:"Assistant IA",          sub:"Bonus"},
  ];

  const TITLES={
    acteurs:"Acteurs — Tableau de bord",
    cahier:"Cahier de textes — Fonctionnalités",
    planning:"Planning & Emploi du temps",
    appli:"Application — Technologies & Docs",
    ia:"Assistant Pédagogique IA",
  };

  return(
    <div className="app">
      {/* ── SIDEBAR ─────────────────────────── */}
      <aside className="sidebar">
        <div className="sidebar-logo">
          <div className="logo-icon">📓</div>
          <div>
            <div className="logo-name">CahierSmart</div>
            <div className="logo-sub">Application complète</div>
          </div>
        </div>

        <nav className="sidebar-nav">
          <div className="nav-section">Les 4 parties</div>
          {NAV.map(n=>(
            <button key={n.id} className={`nav-item${page===n.id?" active":""}`} onClick={()=>setPage(n.id)}>
              <span className="nav-ico">{n.ico}</span>
              <span>
                <span style={{display:"block"}}>{n.label}</span>
                <span style={{display:"block",fontSize:".62rem",opacity:.5,marginTop:1}}>{n.sub}</span>
              </span>
            </button>
          ))}
        </nav>

        <div className="sidebar-user">
          <div className="user-av">AS</div>
          <div>
            <div className="user-name">Amadou Sall</div>
            <div className="user-role">Enseignant · T·S1</div>
          </div>
        </div>
      </aside>

      {/* ── MAIN ────────────────────────────── */}
      <div className="main">
        {/* Topbar — style nav du site */}
        <div className="topbar">
          <div className="topbar-title">{TITLES[page]}</div>
          <div className="topbar-right">
            {page==="ia"&&(
              <span className="badge badge-ok" style={{display:"inline-flex",alignItems:"center",gap:6}}>
                <span style={{width:6,height:6,borderRadius:"50%",background:"var(--accent)",display:"inline-block"}}/>
                IA connectée
              </span>
            )}
            <span className="badge badge-blue">2025–2026</span>
          </div>
        </div>

        <div className="content">
          {page==="acteurs" &&<PartieActeurs  entries={entries} matieres={matieres}/>}
          {page==="cahier"  &&<PartieCahier   entries={entries} setEntries={setEntries} matieres={matieres} setMatieres={setMatieres}/>}
          {page==="planning"&&<PartiePlanning planning={planning} setPlanning={setPlanning} matieres={matieres}/>}
          {page==="appli"   &&<PartieApp/>}
          {page==="ia"      &&<AssistantIA    matieres={matieres} entries={entries}/>}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
